# dsh-workbuddy-bridge bundle layer.
# Applied when this bundle is listed in a profile. Users may override any of
# these values from their own profile patch layer (same ids, applied later).
#
# 1) The bridge plugin: local OpenAI-compatible endpoint + WorkBuddy auth.
- insert:
    - id: workbuddy-bridge
      name: dsh-workbuddy-bridge

# 2) The LLM provider route. Every model points at the bridge's local
#    endpoint; the bridge forwards to the WorkBuddy backend so billing stays
#    on WorkBuddy credits (no external API keys involved).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      workbuddy:
        displayName: WorkBuddy (credits)
        apiKeyEnv: WORKBUDDY_PROXY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:37321/v1
        models:
          - id: deepseek-v3-2-volc
            name: DeepSeek-V3.2 (x0.29)
            input: ["text"]
            contextWindow: 96000
            maxTokens: 32000
