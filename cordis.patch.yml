# dsh-workbuddy-bridge bundle layer.
# Applied when this bundle is listed in a profile. Users may override any of
# these values from their own profile patch layer (same ids, applied later).
#
# 1) The bridge plugin: local OpenAI-compatible endpoint + WorkBuddy auth.
- insert:
    - id: workbuddy-bridge
      name: dsh-workbuddy-bridge

# 2) The LLM provider route. Every model points at the bridge's local
#    endpoint; the bridge forwards to the WorkBuddy backend so billing stays
#    on WorkBuddy credits (no external API keys involved).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      workbuddy:
        displayName: WorkBuddy (credits)
        apiKeyEnv: WORKBUDDY_PROXY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:37321/v1
        models:
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            input: ["text", "image"]
            contextWindow: 400000
            maxTokens: 50000
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            input: ["text", "image"]
            contextWindow: 400000
            maxTokens: 50000
          - id: glm-5.2
            name: GLM-5.2
            input: ["text", "image"]
            contextWindow: 400000
            maxTokens: 48000
          - id: kimi-k3-1
            name: Kimi K3
            input: ["text", "image"]
            contextWindow: 400000
            maxTokens: 32000
          - id: minimax-m3
            name: MiniMax M3
            input: ["text", "image"]
            contextWindow: 400000
            maxTokens: 128000
          - id: hy4-preview
            name: Hunyuan HY4 Preview
            input: ["text", "image"]
            contextWindow: 192000
            maxTokens: 64000
          - id: hy3
            name: Hunyuan HY3 (free)
            input: ["text", "image"]
            contextWindow: 192000
            maxTokens: 64000
