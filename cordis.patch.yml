# Bundle layer. The model list here is only what exists before the bridge has
# ever reached the live catalog: the plugin regenerates the whole `workbuddy`
# provider into ~/.dsh/cordis.patch.yml (which dsh-hmr watches, so it applies
# without a restart) as soon as it has a realm's catalog. Keep this list to a
# single placeholder — anything longer here is a stale snapshot that the picker
# would show before the first refresh.
- insert:
  - id: workbuddy-bridge
    name: dsh-workbuddy-bridge
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      workbuddy:
        displayName: WorkBuddy (预积分计费)
        apiKeyEnv: WORKBUDDY_PROXY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:37321/v1
        models:
        - id: deepseek-v4.1-flash
          name: Deepseek-V4.1-Flash
          input:
          - text
          - image
          contextWindow: 1000000
          maxTokens: 128000
